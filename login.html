{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card"><div class="auth-symbol">S</div><div class="section-kicker">WELCOME BACK</div><h1>Log in to SecureShard</h1><p class="muted">Access your encrypted files and partitions.</p>
<form method="post" class="form-stack">
<label>Username<input name="username" minlength="3" autocomplete="username" required></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<button class="btn primary full" type="submit">Log in <span>→</span></button>
</form><p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p></section></div>
{% endblock %}
