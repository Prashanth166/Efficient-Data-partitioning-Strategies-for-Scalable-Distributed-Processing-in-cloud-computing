{% extends "base.html" %}{% block title %}Error {{ code }}{% endblock %}
{% block content %}<div class="error-page"><div class="error-code">{{ code }}</div><h1>Something went wrong</h1><p class="muted">{{ message }}</p><a class="btn primary" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('index') }}">Return to safety</a></div>{% endblock %}
